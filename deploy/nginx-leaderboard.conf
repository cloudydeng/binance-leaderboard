# Include inside the existing 443 server for 8.216.38.70.
location = /leaderboard {
    return 301 /leaderboard/;
}

# Reuse the trading console's authenticated browser session.
location = /__leaderboard_auth {
    internal;
    proxy_pass http://127.0.0.1:8080/api/accounts;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host 127.0.0.1:8080;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Bot-Admin-Token "";
}

location ^~ /leaderboard/ {
    auth_request /__leaderboard_auth;
    error_page 401 =302 /login.html;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host 127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}
